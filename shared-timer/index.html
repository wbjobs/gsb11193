<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>共享计时器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0f172a; color: #e2e8f0;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; margin: 0;
    }
    .card {
      background: #1e293b; border-radius: 16px; padding: 32px 40px;
      box-shadow: 0 10px 40px rgba(0,0,0,.4); text-align: center; width: 420px;
    }
    h1 { font-size: 18px; font-weight: 600; color: #94a3b8; margin: 0 0 8px; }
    #time {
      font-size: 64px; font-variant-numeric: tabular-nums; font-weight: 700;
      letter-spacing: 2px; margin: 8px 0 4px;
    }
    #time.finished { color: #4ade80; }
    #status { font-size: 14px; color: #94a3b8; margin-bottom: 20px; min-height: 20px; }
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    button {
      font-size: 15px; padding: 10px 22px; border: none; border-radius: 8px;
      cursor: pointer; font-weight: 600; transition: filter .15s;
    }
    button:hover:not(:disabled) { filter: brightness(1.15); }
    button:disabled { opacity: .4; cursor: not-allowed; }
    #startPauseBtn { background: #3b82f6; color: #fff; min-width: 96px; }
    #resetBtn { background: #475569; color: #e2e8f0; }
    .duration { display: flex; gap: 8px; justify-content: center; align-items: center; margin-bottom: 20px; }
    .duration input {
      width: 72px; padding: 8px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #e2e8f0; font-size: 15px; text-align: center;
    }
    .duration label { font-size: 13px; color: #94a3b8; }
    #setDurationBtn { background: #0ea5e9; color: #fff; padding: 8px 16px; }
    .debug {
      font-size: 12px; color: #64748b; text-align: left; line-height: 1.7;
      border-top: 1px solid #334155; padding-top: 12px;
      font-variant-numeric: tabular-nums;
    }
    .debug b { color: #94a3b8; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <h1>多标签页共享计时器</h1>
    <div id="time">00:00.00</div>
    <div id="status">空闲</div>
    <div class="controls">
      <button id="startPauseBtn">开始</button>
      <button id="resetBtn">重置</button>
    </div>
    <div class="duration">
      <input id="minutesInput" type="number" min="0" max="999" value="5">
      <label>分</label>
      <input id="secondsInput" type="number" min="0" max="59" value="0">
      <label>秒</label>
      <button id="setDurationBtn">设置时长</button>
    </div>
    <div class="debug">
      <div>标签页 ID: <b id="tabId"></b></div>
      <div>状态版本: <b id="version">0</b>（最后操作: <b id="updatedBy">-</b>）</div>
      <div>时钟偏移校正: <b id="offset">0</b> ms</div>
      <div>已连接标签页: <b id="peers">1</b></div>
    </div>
  </div>
  <script src="shared-timer.js"></script>
</body>
</html>
